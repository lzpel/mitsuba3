# Build wheels of this fork, attach them to a GitHub Release, and publish a
# PEP 503 package index on GitHub Pages (gh-pages branch) so that the wheels
# can be installed with uv / pip without compiling Mitsuba locally.
#
# Trigger: push a tag starting with "wheels-" (e.g. `git tag wheels-1`), or run
# it manually from the Actions tab once this file is on the default branch.
name: Fork wheels (GitHub Pages index)
on:
  push:
    tags:
      - 'wheels-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VARIANTS: "scalar_rgb,scalar_spectral,scalar_spectral_polarized,llvm_ad_rgb,llvm_ad_mono,llvm_ad_mono_polarized,llvm_ad_spectral,llvm_ad_spectral_polarized,cuda_ad_rgb,cuda_ad_mono,cuda_ad_mono_polarized,cuda_ad_spectral,cuda_ad_spectral_polarized,metal_ad_rgb,metal_ad_mono,metal_ad_mono_polarized,metal_ad_spectral,metal_ad_spectral_polarized"
  # Local version label appended to the upstream version (e.g. 3.9.1+lzpel.7).
  # It sorts above the PyPI release of the same version and stays unique per run.
  LOCAL_VERSION: "lzpel.${{ github.run_number }}"

jobs:
  build_wheels:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
        # Version-specific wheels are required wherever PyPI ships a
        # version-specific drjit wheel (installers prefer it over abi3, and an
        # abi3 Mitsuba wheel crashes against it). The stable ABI wheel covers
        # newer Python versions.
        python: [cp310, cp311, cp312, cp313, cp314, cp312_stable]
      fail-fast: false

    name: >
      ${{ matrix.python }} wheel for ${{ matrix.os }}
      ${{ (endsWith(matrix.python, '_stable') && '(stable ABI)') || '' }}
    runs-on: ${{ matrix.os }}

    steps:
      ###########################################################
      # Setup local environment (source code, build requirements)
      ###########################################################
      - uses: Wandalen/wretry.action@v1.2.0
        with:
          action: actions/checkout@v3
          with: |
            submodules: recursive
          attempt_limit: 3
          attempt_delay: 2000

      - uses: actions/setup-python@v4
        name: Install Python
        with:
          python-version: '3.11'

      - name: Install LLVM 18.1.8 on Windows
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 18.1.8

      - name: Prepare compiler environment for Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Required for libjpeg-turbo
      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==3.3.1

      - name: Append local version label
        shell: bash
        run: |
          sed -i.bak 's/^result = "{major}.{minor}.{patch}"$/result = "{major}.{minor}.{patch}+${{ env.LOCAL_VERSION }}"/' pyproject.toml
          grep -q '+${{ env.LOCAL_VERSION }}"' pyproject.toml
          rm pyproject.toml.bak

      ################################################################
      # Set up envvars to build the correct wheel (stable ABI or not)
      ################################################################
      - name: Prepare cibuildwheel environment (UNIX)
        if: ${{ ! endsWith(matrix.python, '_stable') && runner.os != 'Windows' }}
        run: |
          echo "CIBW_BUILD=${{ matrix.python }}-*" >> $GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=\"cmake.args=-DMI_DEFAULT_VARIANTS=\"${{ env.VARIANTS }}\"\"" >> $GITHUB_ENV

      - name: Prepare cibuildwheel environment (Windows)
        if: ${{ ! endsWith(matrix.python, '_stable') && runner.os == 'Windows' }}
        run: |
          echo "CIBW_BUILD=${{ matrix.python }}-*" >> $env:GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=cmake.args='-DMI_DEFAULT_VARIANTS='${{ env.VARIANTS }}''" >> $env:GITHUB_ENV

      - name: Prepare cibuildwheel environment for stable ABI wheel (UNIX)
        if: ${{ endsWith(matrix.python, '_stable') && runner.os != 'Windows' }}
        run: |
          stable_cp=$(echo ${{ matrix.python }} | cut -d_ -f1)
          echo "CIBW_BUILD=${stable_cp}-*" >> $GITHUB_ENV
          echo "CIBW_ENVIRONMENT=SKBUILD_WHEEL_PY_API=cp312" >> $GITHUB_ENV
          echo "CIBW_BUILD_FRONTEND=pip; args: --no-build-isolation" >> $GITHUB_ENV
          echo "CIBW_BEFORE_BUILD=python {project}/.github/install_build_deps_abi3.py" >> $GITHUB_ENV
          echo "CIBW_BEFORE_TEST=python {project}/.github/install_build_deps_abi3.py --drjit-only" >> $GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=\"cmake.args=-DDRJIT_STABLE_ABI=ON;-DMI_STABLE_ABI=ON;-DMI_DEFAULT_VARIANTS=${{ env.VARIANTS }}\"" >> $GITHUB_ENV

      - name: Prepare cibuildwheel environment for stable ABI wheel (Windows)
        if: ${{ endsWith(matrix.python, '_stable') && runner.os == 'Windows' }}
        run: |
          $stable_cp = '${{ matrix.python }}' -split '_'
          echo "CIBW_BUILD=$($stable_cp[0])-*" >> $env:GITHUB_ENV
          echo "CIBW_ENVIRONMENT=SKBUILD_WHEEL_PY_API=cp312" >> $env:GITHUB_ENV
          echo "CIBW_BUILD_FRONTEND=pip; args: --no-build-isolation" >> $env:GITHUB_ENV
          echo "CIBW_BEFORE_BUILD=python {project}/.github/install_build_deps_abi3.py" >> $env:GITHUB_ENV
          echo "CIBW_BEFORE_TEST=python {project}/.github/install_build_deps_abi3.py --drjit-only" >> $env:GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=cmake.args='-DDRJIT_STABLE_ABI=ON;-DMI_STABLE_ABI=ON;-DMI_DEFAULT_VARIANTS=${{ env.VARIANTS }}'" >> $env:GITHUB_ENV

      #########################
      # Build and store wheels
      #########################
      - name: Build wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  release:
    name: Attach wheels to a GitHub Release
    runs-on: ubuntu-latest
    needs: [build_wheels]
    # Publish whatever built successfully even if some matrix entries failed
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/*.whl
          tag="${{ github.ref_type == 'tag' && github.ref_name || format('wheels-run{0}', github.run_number) }}"
          gh release create "$tag" dist/*.whl \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Wheels $tag (+${{ env.LOCAL_VERSION }})" \
            --notes "Prebuilt wheels built from ${{ github.sha }}. Install instructions: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

  pages:
    name: Publish package index to gh-pages
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate PEP 503 index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/build_wheel_index.py \
            --repo "${{ github.repository }}" --out site

      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update wheel index (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
